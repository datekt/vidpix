name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: vidpix-windows-x86_64.zip
            binary: vidpix.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: vidpix-linux-x86_64.tar.gz
            binary: vidpix
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: vidpix-macos-x86_64.tar.gz
            binary: vidpix
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: vidpix-macos-arm64.tar.gz
            binary: vidpix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "package/"
          Copy-Item "README.md" "package/"
          Copy-Item "README.ru.md" "package/"
          Copy-Item "CHANGELOG.md" "package/"
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.archive }}"

      - name: Prepare package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          cp README.md README.ru.md CHANGELOG.md package/
          tar -czf "${{ matrix.archive }}" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}